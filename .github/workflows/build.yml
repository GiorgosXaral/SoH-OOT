name: build-boss-overhaul
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Keep LF line endings so the patch applies
      run: git config --global core.autocrlf false
    - name: Checkout this repo (contains boss-overhaul.patch)
      uses: actions/checkout@v6
      with:
        path: builder
    - name: Checkout Ship of Harkinian 9.2.3
      uses: actions/checkout@v6
      with:
        repository: HarbourMasters/Shipwright
        ref: cb71e22a79bc5d1f688fa881795bbd93094895fc
        submodules: true
        path: shipwright
    - name: Apply Boss Overhaul patch
      working-directory: shipwright
      run: git apply --whitespace=nowarn ../builder/boss-overhaul.patch
    - name: Install ninja
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build soh.exe
      working-directory: shipwright
      env:
        VCPKG_ROOT: ${{ github.workspace }}/shipwright/vcpkg
      run: |
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-windows --config Release --parallel 4
    - name: List build output (diagnostics)
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"
        Write-Host "--- build-windows/soh ---"
        Get-ChildItem shipwright/build-windows/soh -Force -ErrorAction Continue | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
        Write-Host "--- every soh*.exe under build-windows ---"
        cmd /c "dir /s /b shipwright\build-windows\soh*.exe" 2>&1 | Write-Host
    - name: Upload soh.exe
      uses: actions/upload-artifact@v7
      with:
        name: soh-boss-overhaul
        path: |
          shipwright/build-windows/**/soh.exe
          shipwright/build-windows/soh/*.dll
        if-no-files-found: error
 
